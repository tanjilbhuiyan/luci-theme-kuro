name: PR Check

on:
  pull_request:
    branches:
      - master
      - main
    paths:
      - 'frontend/**'
      - '.github/renovate.json'
      - 'htdocs/**'
      - 'ucode/**'
      - 'root/**'
      - 'Makefile'

permissions:
  contents: read

jobs:
  lint-and-build:
    name: Lint & Build Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
          run_install: false

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v5
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Prettier check
        run: pnpm prettier --check "src/**/*.{css,js}"

      - name: Build
        run: pnpm build

      - name: Check build output
        run: |
          if [ ! -f "../htdocs/luci-static/kuro/main.css" ]; then
            echo "❌ Build failed: main.css not found"
            exit 1
          fi
          if [ ! -f "../htdocs/luci-static/resources/menu-kuro.js" ]; then
            echo "❌ Build failed: menu-kuro.js not found"
            exit 1
          fi
          echo "✅ Build output verified"

  validate-renovate:
    name: Validate Renovate Config
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check Renovate config changes
        id: renovate-changes
        run: |
          if git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" | grep -qx ".github/renovate.json"; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js
        if: steps.renovate-changes.outputs.changed == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install Renovate
        if: steps.renovate-changes.outputs.changed == 'true'
        run: npm install -g renovate

      - name: Validate Renovate config
        if: steps.renovate-changes.outputs.changed == 'true'
        run: renovate-config-validator
        env:
          RENOVATE_CONFIG_FILE: .github/renovate.json
